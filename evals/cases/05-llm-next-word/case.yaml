genre: 科技/AI
shape: 循环（猜下一个字、接到后面、整体再送回去，重复）
style_refs: [ 何同学, 稚晖君 ]
takeaway: 大模型本质上是一个字一个字地接龙，追求的是听起来像对的，所以数字、人名、出处要自己核实。
questions:
  - q: 大模型每一步实际做的是什么？
    options: [ A. 去网上搜答案, B. 猜下一个字, C. 把问题翻译成代码, D. 先想好整篇再写 ]
    answer: B
  - q: 每写出一个字之后，接下来怎么做？
    options: [ A. 把到目前为止的整段话送回去，再猜下一个, B. 停下等人确认, C. 从头重写, D. 去数据库查证 ]
    answer: A
  - q: 为什么它会一本正经地胡说？
    options: [ A. 故意骗人, B. 网络太慢, C. 没读过任何书, D. 追求听起来像对的，而不是查证过的 ]
    answer: D
