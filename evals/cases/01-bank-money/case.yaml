genre: 财经/宏观
shape: 循环（存款借出再存回，每圈缩小一成，累加成十倍上限）
style_refs: [ 小Lin说, 刘润 ]
takeaway: 银行把存款一圈圈借出去再存回来，每圈留一成准备金，存款总额最多能到最初的十倍。
questions:
  - q: 这段里，银行拿到存款后会怎么处理？
    options: [ A. 全部转给政府, B. 留一小部分当准备金，其余借出去, C. 全部借出去不留, D. 全部锁进金库不动 ]
    answer: B
  - q: 每转一圈，能借出去的钱怎么变化？
    options: [ A. 越来越少，但不会变成零, B. 保持不变, C. 越来越多, D. 第二圈就变成零 ]
    answer: A
  - q: 假设准备金一成，最初存一百块，所有存款加起来最多是多少？
    options: [ A. 两百块, B. 五百块, C. 一百块, D. 一千块 ]
    answer: D
