genre: 数学/概率直觉
shape: 拆解+反直觉（二十三人配成二百五十三对，概率过半）
style_refs: [ 毕导THU, 回形针PaperClip ]
takeaway: 生日问题看的是任意两人的所有配对，二十三个人就有二百五十三对，所以重合概率超过一半。
questions:
  - q: 二十三个人里，有两人同一天生日的概率大约是多少？
    options: [ A. 不到 10%, B. 约 25%, C. 接近 100%, D. 略超过一半 ]
    answer: D
  - q: 这段解释概率为什么比直觉大？
    options: [ A. 闰年让概率变大, B. 生日分布不均匀, C. 数的是所有两两配对，不是某个特定的人, D. 二十三个人是特殊数字 ]
    answer: C
  - q: 二十三个人一共能配成多少对？
    options: [ A. 一百一十五对, B. 二百五十三对, C. 四十六对, D. 二十三对 ]
    answer: B
