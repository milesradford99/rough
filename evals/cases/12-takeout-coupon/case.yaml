genre: 生活里的经济学
shape: 反转（省了六块，其实多花了六块），一笔小账算到底
style_refs: [ 半佛仙人, 小Lin说 ]
takeaway: 满减让你盯着省了多少，却忽略了为了凑单多花的钱；凑单前先问自己不凑会不会买。
questions:
  - q: 按这段的例子，凑单之后你实际比原本多付了多少？
    options: [ A. 多付六块, B. 多付十二块, C. 少付六块, D. 不多不少 ]
    answer: A
  - q: 例子里你原本打算花多少？
    options: [ A. 四十块, B. 三十四块, C. 三十五块, D. 二十八块 ]
    answer: D
  - q: 这段说凑单前该问自己什么？
    options: [ A. 能省多少, B. 满减能不能叠加, C. 如果不凑，我会买加的那样东西吗, D. 哪家商家更便宜 ]
    answer: C
