genre: 心理学
shape: 反直觉（无关的随机数拽动判断），对比两组被试
style_refs: [ 武志红, 陈海贤 ]
takeaway: 即使数字明显无关，看到它之后你的判断也会被拽过去，这叫锚定效应。
questions:
  - q: 转轮盘的结果和后面的问题是什么关系？
    options: [ A. 轮盘决定谁能答题, B. 轮盘数字就是正确答案, C. 有关，轮盘暗示了答案, D. 无关，只是随机数 ]
    answer: D
  - q: 转到较大数字（六十五）的人，后来的估计比转到较小数字（十）的人？
    options: [ A. 无法比较, B. 一样, C. 更高, D. 更低 ]
    answer: C
  - q: 商店把原价划掉旁边写现价，利用的是什么？
    options: [ A. 从众心理, B. 锚定效应, C. 稀缺效应, D. 损失厌恶 ]
    answer: B
