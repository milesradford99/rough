genre: 职场
shape: 前后对比（同一件事的流水账汇报 vs 结论先行汇报）
style_refs: [ 刘润, 秋叶大叔 ]
takeaway: 汇报要按领导最关心的顺序：先说结论，再说原因，最后说需要他做什么。
questions:
  - q: 第二种汇报比第一种好在哪？
    options: [ A. 更长更详细, B. 语气更客气, C. 先给结论，再原因，再请求, D. 数据更多 ]
    answer: C
  - q: 第一种汇报里，领导听到一半时在做什么？
    options: [ A. 离开会议室, B. 在看手机, C. 打断提问, D. 认真记笔记 ]
    answer: B
  - q: 这段说汇报的顺序应该按什么排？
    options: [ A. 领导最关心的先后, B. 重要程度从低到高, C. 参与人员的职位, D. 事情发生的先后 ]
    answer: A
