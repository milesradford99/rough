genre: 历史
shape: 时间线+反转（朝代很短，制度很长）
style_refs: [ 观复嘟嘟, 小岛浪吹 ]
takeaway: 秦朝只有十五年左右，但它的郡县等制度被汉朝接过去，影响了两千年。
questions:
  - q: 秦朝统一六国后，官员是怎么产生的？
    options: [ A. 由各地百姓选, B. 靠抽签, C. 由朝廷派, D. 世袭 ]
    answer: C
  - q: 秦朝存在的时间和它的影响，对比起来是什么样？
    options: [ A. 都很长, B. 朝代很短，制度影响很长, C. 朝代很长，影响很短, D. 都很短 ]
    answer: B
  - q: “汉承秦制”想说明什么？
    options: [ A. 汉朝接过并沿用了秦的制度, B. 汉朝和秦朝同时存在, C. 汉朝灭了秦朝, D. 汉朝推翻了秦的制度 ]
    answer: A
