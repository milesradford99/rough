genre: 健康/医学常识
shape: 因果链（感冒是病毒、抗生素管细菌、乱吃造成耐药），并推翻一个流行说法
style_refs: [ 丁香医生, 崔玉涛 ]
takeaway: 普通感冒多半是病毒引起，抗生素对它没用，乱吃还会造成耐药，用不用药听医生的。
questions:
  - q: 普通感冒多数由什么引起？
    options: [ A. 病毒, B. 细菌, C. 受凉本身, D. 缺维生素 ]
    answer: A
  - q: 抗生素主要对付什么？
    options: [ A. 过敏, B. 发炎以外的所有症状, C. 病毒, D. 细菌 ]
    answer: D
  - q: 没必要地乱吃抗生素，长期会带来什么后果？
    options: [ A. 没有任何后果, B. 感冒好得更快, C. 细菌慢慢产生耐药，以后药可能压不住, D. 身体产生抗体 ]
    answer: C
