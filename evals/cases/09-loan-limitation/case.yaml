genre: 法律常识
shape: 倒计时/时间线（三年时效，被催款重新起算）
style_refs: [ 罗翔, 李叔凡律师 ]
takeaway: 在中国大陆，普通借款的诉讼时效是三年，但催款并留下记录可以让三年重新起算。
questions:
  - q: 普通借钱纠纷的诉讼时效是多久？
    options: [ A. 一年, B. 三年, C. 十年, D. 没有期限 ]
    answer: B
  - q: 时效过了之后，如果对方自愿把钱还了，会怎样？
    options: [ A. 不能再反悔要回去, B. 要交罚款, C. 可以要求对方把钱要回去, D. 还款无效 ]
    answer: A
  - q: 怎样才能让三年的时效重新开始计算？
    options: [ A. 把借条撕掉, B. 换一位律师, C. 到期前再等一年, D. 中间催过款，并留下对方认可的记录 ]
    answer: D
