genre: 商业案例
shape: 拆解（一杯咖啡的定价被拆成成本、房租、利润，再改变销量重算）
style_refs: [ 半佛仙人, 刘润 ]
takeaway: 房租这类固定成本是定值，卖得越多每杯分摊越少，所以开店最怕的是没人来，而不是价格低。
questions:
  - q: 这段里一杯咖啡的利润是怎么从三块变成六块的？
    options: [ A. 换便宜的豆子, B. 涨价, C. 少给员工发工资, D. 每天卖的杯数翻倍，每杯分摊的房租减半 ]
    answer: D
  - q: 房租在这段里被当作什么性质的成本？
    options: [ A. 卖得越多越贵, B. 每杯都一样多, C. 固定的，不随杯数变, D. 可以忽略 ]
    answer: C
  - q: 这段认为开店的人最怕什么？
    options: [ A. 咖啡卖得便宜, B. 店里没人, C. 同行开在隔壁, D. 豆子涨价 ]
    answer: B
