genre: 科普（物理）
shape: 反转/对比（八分钟 vs 上万年，两段路程的长度对比）
style_refs: [ 回形针PaperClip, 毕导THU ]
takeaway: 阳光从太阳表面到地球只要八分多钟，但能量从太阳核心挤到表面要一万年以上。
questions:
  - q: 光从太阳核心挤到表面，大约要花多久？
    options: [ A. 一万年以上, B. 八分多钟, C. 八小时, D. 八天 ]
    answer: A
  - q: 光在太阳内部走得那么慢，是因为什么？
    options: [ A. 太阳核心很冷, B. 被磁场吸住, C. 光在那里本来就慢得多, D. 一路被粒子撞来撞去，不断改变方向 ]
    answer: D
  - q: 这段里哪一段路花的时间最长？
    options: [ A. 太阳表面到地球, B. 地球上空到你的皮肤, C. 太阳核心到太阳表面, D. 一样长 ]
    answer: C
