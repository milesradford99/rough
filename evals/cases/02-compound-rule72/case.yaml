genre: 个人理财
shape: 前后对比（同一本金、两种收益率，沿时间翻倍）
style_refs: [ 银行螺丝钉, 刘润 ]
takeaway: 复利的差距来自时间和一个不起眼的收益率，收益率差一半，三十六年后结果差近三倍。
questions:
  - q: 用七十二法则，本金翻一倍要多少年？
    options: [ A. 七十二减去收益率, B. 收益率除以七十二, C. 七十二除以年化收益率, D. 七十二乘以收益率 ]
    answer: C
  - q: 本金同样一万、放三十六年，年化 6% 和年化 3% 比，谁的结果更大、大多少？
    options: [ A. 差不多一样, B. 6% 大近三倍, C. 6% 大约大一倍, D. 3% 更大 ]
    answer: B
  - q: 这段想告诉你，复利最值钱的是什么？
    options: [ A. 时间和利率, B. 选对热门产品, C. 某一年赚得特别多, D. 每月加仓的次数 ]
    answer: A
