# 执行者的产物：照 plan.yaml 把这块板画出来。
# 开口的位置、全景、分区、板的大小都由计划决定，这里只管每样东西在哪儿、多大、什么时候怎么画。
# 分区（画板 960×1250）：top [0, 0, 960, 190]  loop [0, 190, 960, 350]  stair [0, 540, 960, 440]  bottom [0, 980, 960, 270]
elements:
  bank:  { cast: bank, size: 140, in: top, at: [210, 100] }
  me:    { cast: me, size: 160, in: top, at: [500, 105], shade: false }
  dep:   { arrow: [[430, 105], [305, 105]], label: 存 }
  q:     { text: "?", size: 100, color: red, in: top, at: [70, 95] }
  rule:  { text: "留一成", size: label, color: red, in: top, at: [800, 70] }
  rule2: { text: "准备金", size: note, color: gray, below: rule, gap: 8 }
  # 一把不画出来的比例尺：100 块 = 500 像素。每条横条只写数值，长度和对齐都由它算
  money: { axis: [0, 100], length: 500, at: [250, 250] }
  # 第 1 条：100 = 留 10 + 借出 90
  n1:  { text: "100", size: key, at: [225, 250], anchor: right }
  r1:  { span: [0, 10],  on: money, at: [0, 250], color: red, overlap: true }
  l1:  { span: [10, 100], on: money, at: [0, 250], color: blue }
  r1t: { text: "留10", size: note, color: red, below: r1, gap: 10 }
  l1t: { text: "借出 90", size: note, color: blue, below: l1, gap: 10 }
  # 右侧：钱绕一圈回来
  shop:  { cast: shop, size: 100, at: [870, 300], label: 面馆, labelSize: 36 }
  mill:  { cast: mill, size: 96, at: [870, 500], label: 面粉店, labelSize: 36 }
  lend:  { arrow: [l1.right, shop.left], curve: -0.2, pad: 6 }      # 关系 lend：银行借出的那一段 → 面馆
  pay:   { arrow: [[870, 390], [870, 440]] }                        # 关系 pay
  back:  { arrow: [[818, 520], [712, 450]], curve: -0.25 }          # 关系 back：绕回银行，变成下一条
  backT: { text: "存回 90", size: note, color: gray, at: [800, 615] }
  # 第 2 条：90
  n2:  { text: "90", size: key, at: [n1.right, 440], anchor: right }
  r2:  { span: [0, 9], on: money, at: [0, 440], color: red, overlap: true }
  l2:  { span: [9, 90], on: money, at: [0, 440], color: blue }
  r2t: { text: "留9", size: note, color: red, below: r2, gap: 10 }
  l2t: { text: "借出 81", size: note, color: blue, below: l2, gap: 10 }
  # 第 3 条：81
  n3:  { text: "81", size: key, at: [n1.right, 610], anchor: right }
  r3:  { span: [0, 8.1], on: money, at: [0, 610], color: red, overlap: true }
  l3:  { span: [8.1, 81], on: money, at: [0, 610], color: blue }
  # 第 4 条：73
  n4:  { text: "73", size: key, at: [n1.right, 720], anchor: right }
  r4:  { span: [0, 7.3], on: money, at: [0, 720], color: red, overlap: true }
  l4:  { span: [7.3, 73], on: money, at: [0, 720], color: blue }
  # 第 5 条：66
  n5:  { text: "66", size: key, at: [n1.right, 830], anchor: right }
  r5:  { span: [0, 6.6], on: money, at: [0, 830], color: red, overlap: true }
  l5:  { span: [6.6, 66], on: money, at: [0, 830], color: blue }
  dots: { text: "……", size: key, color: gray, at: [r1.left, 915], anchor: left }
  many: { text: "几十圈", size: label, color: gray, at: [800, 760] }
  edge: { line: [l2.to, l5.to], color: red, rough: 1.0, pad: 0 }
  nz:   { text: "≠ 0", size: key, color: red, at: [690, 915] }
  # 汇总
  brace: { line: [[70, 225], [70, 930]], color: gray }
  bra2:  { arrow: [[70, 930], [70, 1010]], color: gray }
  sum:   { text: "100+90+81+…", size: key, in: bottom, at: [40, 80], anchor: left }
  total: { text: "= 1000", size: hero, color: blue, in: bottom, at: [690, 78] }
  cap:   { note: 理论上限, target: total, side: bottom, size: note }
  ten:   { text: "×10", size: key, color: red, in: bottom, at: [840, 188] }
  make:  { text: "创造存款", size: label, color: blue, in: bottom, at: [140, 188] }
  real:  { note: 留现金, target: back, side: left, size: note }
  real2: { note: 不借光, target: lend, side: top, size: note }
  first: { mark: underline, target: n1, color: blue }
beats:
  - { at: "你有没有想过", intent: 近景：画出银行, do: [{ camera: { focus: [bank, q], pad: 110 }, dur: 0.1 }, { draw: bank }] }
  - { at: "是怎么越变越多", intent: 一个问号, do: [{ draw: q }] }
  - { at: "假设你存进", intent: 你把钱存进银行；镜头往下带出第一条：100, do: [{ camera: { focus: [bank, me, n1], pad: 60 } }, { draw: [me, dep] }, { draw: n1 }] }
  - { at: "规定要留一成", intent: 擦掉问号，写下规则：留一成当准备金, do: [{ erase: q, dur: 0.3 }, { draw: [rule, rule2] }] }
  - { at: "也就是十块", intent: 近景：推到第一条的左端，头上涂出红色的一小段：留 10, do: [{ camera: { focus: [n1, r1], pad: 110 } }, { draw: [r1, r1t] }] }
  - { at: "剩下的九十块", intent: 拉开到整条：剩下的一长段是蓝色，借出 90, do: [{ camera: { focus: [r1, l1, rule], pad: 40 } }, { draw: [l1, l1t] }] }
  - { at: "比如借给一家面馆", intent: 近景：推到板的右侧。箭头从蓝色那段出发，到面馆, do: [{ camera: { focus: [shop, mill], pad: 150 } }, { draw: [lend, shop] }] }
  - { at: "付给了面粉店", intent: 面馆把钱付给面粉店, do: [{ draw: [pay, mill] }] }
  - { at: "存回银行", intent: 拉回全景：钱绕一圈回到银行，板上长出第二条，90, do: [{ camera: home }, { draw: [backT, back] }, { draw: n2 }] }
  - { at: "银行再留九块", intent: 第二条同样分成红和蓝：留 9, do: [{ draw: [r2, r2t] }] }
  - { at: "再借出去八十一块", intent: 借出 81，比上一条短一截, do: [{ draw: [l2, l2t] }] }
  - { at: "就这样一圈一圈", intent: 第三、四、五条接连长出来，一条比一条短, do: [{ draw: [n3, r3, l3] }, { draw: [n4, r4, l4] }, { draw: [n5, r5, l5] }] }
  - { at: "转个几十圈", intent: 省略号：后面还有几十条, do: [{ draw: [dots, many] }] }
  - { at: "借出去的钱少一成", intent: 沿着横条的右端拉一条红色斜线：每条都短一成, do: [{ draw: edge }] }
  - { at: "可永远不会变成零", intent: 斜线尽头写上 ≠ 0, do: [{ draw: nz }] }
  - { at: "把所有存款加起来", intent: 左边一条竖线把所有横条括起来，往下汇成一行算式, do: [{ draw: [brace, bra2] }, { draw: sum }] }
  - { at: "最多是一千块", intent: 近景：推到板底，写下结果 1000, do: [{ camera: { focus: [total], pad: 130 } }, { draw: total }] }
  - { at: "的十倍", intent: 红色的 ×10, do: [{ draw: ten }] }
  - { at: "不只是保管钱", intent: 拉回全景：整块板就是“钱是怎么变多的”, do: [{ camera: home }, { pulse: bank }] }
  - { at: "创造存款", intent: 回头给最上面那 100 画一道线：只有它是你存的，其余都是创造出来的, do: [{ draw: make }, { draw: first }] }
  - { at: "借款人会留现金", intent: 回到“存回”那条箭头上：现实里钱会漏出去, do: [{ draw: real }] }
  - { at: "银行也不会借光", intent: 回到“借出”那条箭头上：银行也不会全借出去, do: [{ draw: real2 }] }
  - { at: "只是理论上的上限", intent: 给 1000 加一句小字：理论上限, do: [{ draw: cap }] }
