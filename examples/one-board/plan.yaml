# 规划者的产物：这条片子讲的是一个什么系统。不写坐标。
thesis: 银行把同一笔存款反复借出去，你存的 100 块最多能变成 1000 块存款

cast:
  bank: { name: 银行,   look: { doodle: bank } }
  me:   { name: 你,     look: { figure: give-left } }
  shop: { name: 面馆,   look: { doodle: bowl } }
  mill: { name: 面粉店, look: { doodle: sack } }

relations:
  dep:  { from: me,   to: bank, label: 存 }
  lend: { from: bank, to: shop }
  pay:  { from: shop, to: mill }
  back: { from: mill, to: bank }

boards:
  - id: board
    picture: 每一圈的存款是一条横条，左对齐、共用一根轴，逐条变短；每条分成红色的“留下”和蓝色的“借出”；借出的钱从右侧绕一圈回来变成下一条；最后所有横条往下汇成 1000。
    grid:
      rows: [190, 350, 440, 270]
      areas:
        - [top]
        - [loop]
        - [stair]
        - [bottom]
    regions:
      top: 谁、往哪儿存、规则
      loop: 第一圈：100 → 借出 → 面馆 → 面粉店 → 存回 → 90
      stair: 后面几圈：越来越短，但不归零
      bottom: 汇总：1000，十倍
    segments:
      - at: "你有没有想过"
        act: 设问
        in: top
        show: [bank]
        words: ["?"]
        intent: 画出银行，打一个问号
      - at: "假设你存进"
        act: 例子
        in: top
        show: [me]
        link: [dep]
        words: ["100"]
        intent: 你把钱存进银行；板上出现第一条的数字 100
      - at: "规定要留一成"
        act: 说法
        in: loop
        diagram: 第一条横条的左端涂出红色的一小段（100 里的 10）
        words: [留一成, 准备金, 留10]
        intent: 擦掉问号，写下规则；第一条的头上涂红：留 10
      - at: "剩下的九十块"
        act: 算账
        in: loop
        diagram: 第一条剩下的一长段涂蓝（90），和红色那段共用一根轴
        words: ["借出 90"]
        intent: 剩下的一长段是蓝色，借出 90
      - at: "比如借给一家面馆"
        act: 例子
        in: loop
        show: [shop]
        link: [lend]
        intent: 箭头从蓝色那段出发，到面馆
      - at: "付给了面粉店"
        act: 例子
        in: loop
        show: [mill]
        link: [pay]
        intent: 面馆把钱付给面粉店
      - at: "存回银行"
        act: 例子
        in: loop
        link: [back]
        diagram: 第二条横条的数字 90，和第一条左对齐
        words: ["存回 90", "90"]
        intent: 钱绕一圈回到银行，板上长出第二条
      - at: "银行再留九块"
        act: 算账
        in: loop
        diagram: 第二条同样分成红（9）和蓝（81），比第一条短一截
        words: [留9, "借出 81"]
        intent: 第二条分成红和蓝，比上一条短一截
      - at: "就这样一圈一圈"
        act: 理由
        in: stair
        diagram: 第三、四、五条横条（81、73、66），一条比一条短，后面是省略号
        words: ["81", "73", "66", 几十圈]
        intent: 后面几条接连长出来，一条比一条短
      - at: "借出去的钱少一成"
        act: 转折
        in: stair
        joins: [loop]
        diagram: 从第二条到第五条，沿着横条的右端拉一条红色斜线
        words: ["≠ 0"]
        intent: 红色斜线：每条都短一成，但到不了零
      - at: "把所有存款加起来"
        act: 结论
        in: bottom
        joins: [stair]
        diagram: 左侧一条竖线把所有横条括起来，往下指向一行算式
        words: ["100+90+81+…", "= 1000", "×10"]
        intent: 所有横条往下汇成一行算式，结果 1000，十倍
      - at: "不只是保管钱"
        act: 结论
        in: top
        revisit: [bank]
        words: [创造存款]
        intent: 拉回全景；回到银行身上：它在创造存款。给最上面的 100 画一道线，只有它是你存的
      - at: "借款人会留现金"
        act: 补充
        in: loop
        revisit: [back, lend]
        words: [留现金, 不借光, 理论上限]
        intent: 回到那一圈上：存回的那一段会漏掉现金，借出的那一段也不会借光；1000 只是上限
